<!DOCTYPE html>
<html>
<head>
    <title>Employee CRUD Operations</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f5f5f5;
            margin: 0;
        }
        
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .container {
            flex: 1;
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 20px;
        }
        
        .container h2 {
            margin-top: 0;
            font-size: 1.5em;
            color: #333;
        }
        
        label {
            display: block;
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
        }
        
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
            box-sizing: border-box;
        }
        
        button {
            margin-top: 15px;
            padding: 8px 15px;
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
        }
        
        button:hover {
            background-color: #d0d0d0;
        }
        
        .response-box {
            margin-top: 15px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 3px;
            background-color: #fafafa;
        }
        
        .response-box h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #333;
        }
        
        .response-box div {
            font-size: 13px;
            word-break: break-all;
            color: #333;
        }
    </style>
</head>
<body>

<div class="row">
    <div class="container" id="container1">
        <h2>GET</h2>

        <label>Enter ID:</label>
        <input id="input_id_get" type="number" required>

        <button type="button" onclick="func_get()">Get</button>

        <div class="response-box">
            <h3>Response</h3>
            <div id="output1"></div>
        </div>
    </div>

    <div class="container" id="container2">
        <h2>POST</h2>

        <label>Enter Data (JSON):</label>
        <input type="text" id="input_data_id_post" placeholder="{name:'jhon' ,email:'abc@gmail.com'}" required>

        <button type="button" onclick="func_post()">Post</button>

        <div class="response-box">
            <h3>Response</h3>
            <div id="output2"></div>
        </div>
    </div>
</div>

<div class="row">
    <div class="container" id="container3">
        <h2>PUT</h2>

        <label>Enter ID:</label>
        <input id="input_id_put" type="number" required>

        <label>Input Data (JSON):</label>
        <input type="text" id="input_data_id_put">

        <button type="button" onclick="func_put()">Put</button>

        <div class="response-box">
            <h3>Response</h3>
            <div id="output3"></div>
        </div>
    </div>

    <div class="container" id="container4">
        <h2>DELETE</h2>

        <label>Enter ID:</label>
        <input id="input_id_delete" type="number" required>

        <button type="button" onclick="func_delete()" >Delete</button>

        <div class="response-box">
            <h3>Response</h3>
            <div id="output4"></div>
        </div>
    </div>
</div>

<script>
    function func_get(){
        let inputfield = document.getElementById("input_id_get")
        let id = inputfield.value

        let url;

        if(id==""){
            //the user is requesting all documents
            url  = "http://192.168.29.99:8080/api/employees"
        }
        else{
            //user specified the id
            url  = "http://192.168.29.99:8080/api/employees/" + id
        }

        
        fetch(url, { method: 'get' })
        .then(response => response.json())
        .then(data => {
            document.getElementById("output1").innerHTML = `<pre> ${ JSON.stringify(data,null,2) } </pre> `
        })

        inputfield.value = ''
    }

    function func_post(){
        
        let url = "http://192.168.29.99:8080/api/employees"
        let input_data = document.getElementById("input_data_id_post").value
        let json_data = JSON.parse(input_data)
        fetch(url, {
            method: 'post',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(json_data)
        })
        .then(response => response.json())
        .then(data => {
            toast("new employee added!!!")
            document.getElementById("output2").innerHTML = ` ${ JSON.stringify(data,null,2) }  `
            showall()
        })

        document.getElementById("input_data_id_post").value = ''

        
    }

    function func_put(){
        
        let id = document.getElementById("input_id_put").value
        let url = "http://192.168.29.99:8080/api/employees/" + id
        let input_data = document.getElementById("input_data_id_put").value
        let json_data = JSON.parse(input_data)
        fetch(url, {
            method: 'put',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(json_data)
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById("output3").innerHTML = ` ${ JSON.stringify(data,null,2) }  `
            showall()
        })

        document.getElementById("input_id_put").value = ''
        document.getElementById("input_data_id_put").value = ''

        
    }

    function func_delete(){
        let id = document.getElementById("input_id_delete").value
        let url = "http://192.168.29.99:8080/api/employees/" + id
        fetch(url, { method: 'delete' })
        .then(response => response.text())
        .then(data => {
            document.getElementById("output4").innerHTML = ` ${ data }  `
            showall()
        })

        

        document.getElementById("input_id_delete").value = ''

        
    }
    function showall(){
        let url = "http://192.168.29.99:8080/api/employees"

        fetch(url,{
            method :'get'
        })

        .then(response => response.json())
        .then(data =>
             document.getElementById("output1").innerHTML  = `<pre> ${ JSON.stringify(data,null,2) } </pre>`
        )

       
    }

    function toast(msg) {
        let t = document.createElement('div');
        t.innerText = msg;
        t.style.position = 'fixed';
        t.style.bottom = '20px';
        t.style.right = '20px';
        t.style.background = 'black';
        t.style.color = 'white';
        t.style.padding = '10px';
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 1000);
    }

</script>

</body>
</html>
